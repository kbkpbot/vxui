<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Markdown Editor — vxui</title>
<link rel="stylesheet" href="./stylesheet.css"/>
<script src="./js/htmx.js"></script>
<script src="./js/vxui-ws.js"></script>
</head>
<body hx-ext="vxui-ws">
<header>
<h1>MD</h1>
<input id="path" type="text" placeholder="/path/to/file.md" spellcheck="false"/>
<button id="open" class="act">Open</button>
<button id="save" class="act save">Save</button>
<button id="new" class="act">New</button>
<div id="hud"><span class="msg">new document</span></div>
</header>
<div id="notice"><span class="warn"></span></div>
<main>
<textarea id="editor" spellcheck="false" placeholder="# Start typing markdown…"></textarea>
<div id="preview" class="md-body"></div>
</main>
<script>
// Editor wiring. Two response styles are in play:
//   /preview returns an HTML fragment  -> injected into #preview
//   /open /save /new return JSON       -> parsed and applied to the editor
(function () {
    var editor = document.getElementById('editor');
    var preview = document.getElementById('preview');
    var hud = document.getElementById('hud');
    var noticeEl = document.querySelector('#notice .warn');
    var pathInput = document.getElementById('path');
    var debounceTimer = null;

    function notice(msg, warn) {
        if (noticeEl) { noticeEl.textContent = msg || ''; noticeEl.className = warn ? 'warn' : ''; }
    }
    function hudMsg(msg) { hud.innerHTML = '<span class="msg">' + msg + '</span>'; }

    function rpc(path, params) {
        return window.vxuiWs.rpc({ path: path, parameters: params || {} });
    }

    // live preview, debounced
    editor.addEventListener('input', function () {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function () {
            rpc('/preview', { content: editor.value }).then(function (html) {
                preview.innerHTML = html;
            });
        }, 300);
    });

    document.getElementById('open').addEventListener('click', function () {
        rpc('/open', { path: pathInput.value }).then(function (raw) {
            var r = JSON.parse(raw);
            if (!r.ok) { notice(r.error, true); return; }
            editor.value = r.content;
            pathInput.value = r.path;
            notice(''); 
            hudMsg('opened ' + r.path + ' · ' + r.chars + ' chars');
            preview.innerHTML = '';
            editor.dispatchEvent(new Event('input'));
        }).catch(function (e) { notice(e.message || e, true); });
    });

    document.getElementById('save').addEventListener('click', function () {
        rpc('/save', { path: pathInput.value, content: editor.value }).then(function (raw) {
            var r = JSON.parse(raw);
            if (!r.ok) { notice(r.error, true); return; }
            pathInput.value = r.path;
            notice('');
            hudMsg('saved ' + r.path + ' · ' + r.chars + ' chars · ' + r.saved_at);
        }).catch(function (e) { notice(e.message || e, true); });
    });

    document.getElementById('new').addEventListener('click', function () {
        rpc('/new', {}).then(function () {
            editor.value = ''; pathInput.value = '';
            preview.innerHTML = '';
            hudMsg('new document'); notice('');
        });
    });

    // ---- drag & drop: drop a text file anywhere on the window ----
    // The browser resolves ALL OS differences (Windows shell, Linux
    // file managers); the page only sees File objects. Note: browsers do not
    // expose the dropped file's full path — the save path defaults to the
    // file name and can be adjusted before saving.
    var MAX_DROP = 5 * 1024 * 1024; // 5MB — this is a text editor

    function hasFiles(e) {
        return e.dataTransfer && e.dataTransfer.types && e.dataTransfer.types.indexOf('Files') >= 0;
    }
    function dragHighlight(on) {
        document.body.classList.toggle('dragging', on);
    }
    ['dragenter', 'dragover'].forEach(function (ev) {
        document.addEventListener(ev, function (e) {
            if (!hasFiles(e)) { return; }
            e.preventDefault();
            dragHighlight(true);
        });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
        document.addEventListener(ev, function (e) {
            if (ev === 'drop' || e.target === document.documentElement || e.relatedTarget === null) {
                dragHighlight(false);
            }
        });
    });
    document.addEventListener('drop', function (e) {
        if (!hasFiles(e)) { return; }
        e.preventDefault();
        dragHighlight(false);
        var f = e.dataTransfer.files[0];
        if (!f) { return; }
        if (f.size > MAX_DROP) {
            notice('"' + f.name + '" is ' + (f.size / 1048576).toFixed(1) + 'MB — too large for the editor (max 5MB)', true);
            return;
        }
        f.text().then(function (text) {
            editor.value = text;
            pathInput.value = f.name; // adjust the directory before saving
            preview.innerHTML = '';
            editor.dispatchEvent(new Event('input'));
            notice('dropped "' + f.name + '" — adjust the save path if needed');
            hudMsg('dropped ' + f.name + ' · ' + f.size + ' bytes');
        }).catch(function (err) {
            notice('cannot read "' + f.name + '": ' + (err.message || err), true);
        });
    });
})();
</script>
</body>
</html>
