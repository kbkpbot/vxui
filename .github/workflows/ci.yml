name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        uses: vlang/setup-v@v1
        with:
          check-latest: true

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          v fmt -diff vxui.v display.v display_linux.v display_macos.v display_windows.v display_default.v displaymgr.v config.v configfile.v routing.v ws.v clients.v jsexec.v utils.v embed.v vxui_test_helpers.v > /dev/null || {
            echo "Formatting issues found. Run: v fmt -w vxui.v display.v display_linux.v display_macos.v display_windows.v display_default.v displaymgr.v config.v configfile.v routing.v ws.v clients.v jsexec.v utils.v embed.v vxui_test_helpers.v"
            v fmt -diff vxui.v display.v display_linux.v display_macos.v display_windows.v display_default.v displaymgr.v config.v configfile.v routing.v ws.v clients.v jsexec.v utils.v embed.v vxui_test_helpers.v
            exit 1
          }

      - name: Vet
        run: v vet .

      - name: Run tests
        run: v test .
