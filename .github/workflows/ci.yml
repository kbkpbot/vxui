name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        uses: vlang/setup-v@v1
        with:
          check-latest: true

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          v fmt -diff vxui.v display.v embed.v utils.v vxui_test.v > /dev/null || {
            echo "Formatting issues found. Run: v fmt -w *.v"
            v fmt -diff vxui.v display.v embed.v utils.v vxui_test.v
            exit 1
          }

      - name: Run tests
        run: v test .
